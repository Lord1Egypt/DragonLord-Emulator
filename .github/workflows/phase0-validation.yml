name: Phase 0 modern foundation validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'phase0/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-and-harness:
    name: Evidence and harness (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Preserve evidence bytes during checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Verify preserved and recovery evidence artifacts
        run: |
          python phase0/gpu-recovery/tools/verify-evidence.py --include-recovery
          python phase0/gpu-readiness/tools/verify-evidence.py
      - name: Harness regressions (not GPU qualification)
        run: |
          python -m unittest discover -s phase0/tests -v
          python -m unittest discover -s phase0/gpu-feasibility/tests -v
          python -m unittest discover -s phase0/gpu-recovery/tests -v
          python -m unittest discover -s phase0/gpu-readiness/tests -v
      - name: Install pinned lint tool
        run: python -m pip install ruff==0.14.4
      - name: Lint Python syntax and undefined names
        run: >-
          python -m ruff check --select E9,F63,F7,F82
          phase0/tools phase0/tests
          phase0/gpu-feasibility/tools phase0/gpu-feasibility/tests
          phase0/gpu-recovery/tools phase0/gpu-recovery/tests
          phase0/gpu-readiness/tools phase0/gpu-readiness/tests
      - name: Parse native PowerShell scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem phase0 -Filter *.ps1 -Recurse | Where-Object { $_.FullName -notmatch '[\\/]\.work[\\/]' } | ForEach-Object {
            $tokens=$null; $parseErrors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$parseErrors)
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }

  corrected-fence-acceptance:
    name: Corrected fence acceptance (baseline FAIL retained)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Fetch exact source pins
        run: python phase0/gpu-recovery/tools/fetch-probe-sources.py
      - name: Reproduce baseline failures and require every corrected case to pass
        run: python phase0/gpu-recovery/tools/test-fence-overlay.py --output phase0/results/ci-fence-overlay
      - name: Publish explicit correctness statuses
        if: always()
        shell: python
        run: |
          import json, os
          from pathlib import Path
          p=Path('phase0/results/ci-fence-overlay/result.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('## Source callback acceptance only\nGPU, WHPX sharing and actual device reset: NOT TESTED.\n')
              if p.exists():
                  d=json.loads(p.read_text())
                  for s in d['suites']:
                      out.write(f"- {s['name']}: {s.get('correctness','FAIL')} ({len(s.get('failed',[]))} failing cases)\n")
              else:
                  out.write('No result: FAIL/BLOCKED; inspect the failed step.\n')
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: fence-source-results-${{ github.sha }}
          path: phase0/results/ci-fence-overlay/
          if-no-files-found: error
          retention-days: 14
