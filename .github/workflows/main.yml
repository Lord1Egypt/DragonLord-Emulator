name: Legacy Windows engine (manual, unqualified)

# Historical failure: actions/runs/41755551737; isolated from modern acceptance.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-build:
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-pixman
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-capstone
            mingw-w64-ucrt-x86_64-glfw
      - name: Legacy configure and build (failure remains a failure)
        run: |
          ./configure --disable-gtk --enable-sdl --target-list=x86_64-softmmu --disable-werror
          make -j4
